# trigger: branch deploy verification 2026-08-11
# Netlify build settings live here, in code — not in the dashboard.
# Netlify auto-installs the Next.js Runtime when it detects next in package.json.

[build]
  command = "npm run build"
  publish = ".next"

  # ── שמירה על מכסת דקות הבנייה (300 דק'/חודש; חריגה משעה את האתר) ──────────
  # קוד יציאה 0 = דלג על הבנייה · 1 = בְּנֵה.
  # דילוג כשהשינוי נגע אך ורק בתיעוד ובקובץ המצב. הסוכנים כותבים ל-project_plan.md
  # בכל טיק — 14 מתוך 15 הקומיטים הראשונים לא נגעו בקוד כלל.
  # CACHED_COMMIT_REF ריק בבנייה ראשונה → הפקודה נכשלת → נבנה. כישלון בטוח.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude)docs/' ':(exclude)project_plan.md'"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # playwright is a devDependency used only by `npm run check:mobile`.
  # Without this flag its postinstall downloads ~200MB of browsers on every deploy.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

  # ── 🔴 סורק הסודות של Netlify · נוסף 28/08 אחרי שלושה ימי בנייה שבורה ──────────
  # **מה קרה:** `Branch Deploy: dev` נפל ב-25/08 וב-26/08 עם `Exposed secrets detected`
  # ⇒ `github_pat_***`. הסורק ⛔ אינו בודק רק ערכים של משתני סביבה — הוא מחפש **תבניות
  # מפתח מוכרות בקוד המקור**, ותפס מחרוזת־דוגמה מזויפת ב-`scripts/agent-prompts.test.ts`.
  # ⛔ **והבנייה נפלה בשקט: ⛔ אף שער בלופ ⛔ לא מדד את מצב הבנייה של Netlify.**
  #
  # שתי שכבות, ⛔ ולא אחת:
  #   ⓐ הדוגמאות בקובץ הבדיקה **מורכבות בזמן ריצה** ⇒ ⛔ אין תבנית ברצף בשום קובץ.
  #   ⓑ והשורה הזאת — `scripts/` · `plan/` · `docs/` ⛔ **אינם נארזים לאתר**: הם מכונת
  #      הלופ והתיעוד. ⇒ החרגתם ⛔ אינה מחלישה את הסריקה על קוד שכן מגיע ללומד.
  # ⚠️ **⛔ אל תוסיף כאן `app/`, `lib/` או `components/`** — שם הסריקה היא הגנה אמיתית.
  SECRETS_SCAN_OMIT_PATHS = "scripts/**,plan/**,docs/**,skills/**"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

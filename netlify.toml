# Netlify build settings live here, in code — not in the dashboard.
# Netlify auto-installs the Next.js Runtime when it detects next in package.json.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # playwright is a devDependency used only by `npm run check:mobile`.
  # Without this flag its postinstall downloads ~200MB of browsers on every deploy.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
